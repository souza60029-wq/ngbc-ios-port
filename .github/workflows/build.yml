name: NGBC iOS AOT Build Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # NOVO: Baixando o arquivo do jogo via GitHub Releases
    - name: Download Game File (871MB)
      run: |
        echo "Baixando executável do Xbox 360..."
        curl -L -o game.xex "https://github.com/souza60029-wq/ngbc-ios-port/releases/download/v1.0/B26872135B74C4F9A63367A857857D22456064C258"
        echo "Download concluído. Tamanho do arquivo:"
        ls -lh game.xex

    - name: Run AOT Asset Creator
      run: |
        echo "Iniciando a tradução dos assets..."
        python tools/aot_creator.py

    - name: Recompile XEX code
      run: |
        echo "Traduzindo código PowerPC para ARM64..."
        python tools/recompiler.py

    - name: Build iOS App (Metal Engine + Shaders)
      run: |
        mkdir -p Payload/NGBC.app
        SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)

        cp -r src/converted_assets Payload/NGBC.app/

        echo "Compilando Shaders Metal..."
        xcrun -sdk iphoneos metal -c src/Shaders.metal -o Shaders.air \
          -std=ios-metal1.1 \
          -mios-version-min=12.0
        xcrun -sdk iphoneos metallib Shaders.air -o Payload/NGBC.app/default.metallib

        echo "Compilando Código Nativo..."
        xcrun --sdk iphoneos clang -arch arm64 -isysroot "$SDK_PATH" \
          -miphoneos-version-min=12.0 \
          -framework UIKit -framework Foundation -framework Metal -framework MetalKit -framework QuartzCore \
          src/main.m src/AppDelegate.m src/ViewController.m \
          -o Payload/NGBC.app/NGBC

        cat > Payload/NGBC.app/Info.plist << 'EOF'
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>CFBundleExecutable</key>
            <string>NGBC</string>
            <key>CFBundleIdentifier</key>
            <string>com.seuuser.ngbc</string>
            <key>CFBundleName</key>
            <string>NGBC</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>MinimumOSVersion</key>
            <string>12.0</string>
        </dict>
        </plist>
        EOF

    - name: Package to IPA
      run: zip -r NGBC.ipa Payload/

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: NGBC-iOS-IPA
        path: NGBC.ipa