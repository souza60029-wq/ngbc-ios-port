name: NGBC iOS AOT Build Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Run AOT Asset Creator
      run: |
        echo "Iniciando a tradução dos assets do Xbox 360..."
        python tools/aot_creator.py

    - name: Recompile XEX code
      run: |
        echo "Traduzindo código PowerPC para ARM64..."
        python tools/recompiler.py

    # 3. COMPILAÇÃO DO APP iOS (AGORA COM BINÁRIO REAL)
    - name: Build iOS App
      run: |
        echo "Compilando o aplicativo iOS..."
        mkdir -p Payload/NGBC.app

        # Pega o caminho do SDK do iPhone
        SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)

        # Compila o nosso código C em um executável para iPhone (arm64)
        xcrun --sdk iphoneos clang -arch arm64 -isysroot "$SDK_PATH" -miphoneos-version-min=10.0 src/main.c -o Payload/NGBC.app/NGBC

        # Cria o Info.plist
        cat > Payload/NGBC.app/Info.plist << 'EOF'
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>CFBundleExecutable</key>
            <string>NGBC</string>
            <key>CFBundleIdentifier</key>
            <string>com.seuuser.ngbc</string>
            <key>CFBundleName</key>
            <string>NGBC</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
        </dict>
        </plist>
        EOF

    - name: Package to IPA
      run: |
        echo "Empacotando o arquivo .ipa..."
        zip -r NGBC.ipa Payload/

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: NGBC-iOS-IPA
        path: NGBC.ipa