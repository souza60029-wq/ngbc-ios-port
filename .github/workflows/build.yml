name: Gerar IPA (NGBC)

on:
  workflow_dispatch:

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Gerar o C++ do jogo (com descoberta automatica de funcoes)
        shell: bash
        run: bash tools/ci_run.sh 20

      - name: Guardar os logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-ipa-gerar
          path: logs/

      - name: Guardar o gerado
        uses: actions/upload-artifact@v4
        with:
          name: gerado
          retention-days: 1
          path: |
            ppc_out
            dump/img_image.bin
            XenonRecomp/thirdparty/simde
            XenonRecomp/XenonUtils

  ipa:
    needs: gerar
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: gerado

      - name: Compilar e empacotar
        shell: bash
        run: bash tools/build_ipa.sh

      - name: Guardar o IPA
        uses: actions/upload-artifact@v4
        with:
          name: NGBC-iOS-IPA
          path: NGBC.ipa