name: Inspecionar pacote XBLA

on:
  workflow_dispatch:

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Gerar C++ e listar importacoes
        shell: bash
        run: |
          mkdir -p logs/teste_08
          cat > logs/teste_08/00_comando.txt <<'EOF_CMD'
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang cmake ninja-build
          curl -sS -L --fail -o game.pkg "https://github.com/souza60029-wq/ngbc-ios-port/releases/download/v1.0/B26872135B74C4F9A63367A857857D22456064C258"
          python tools/stfs_extract.py game.pkg game_extracted > logs/teste_08/02_stfs.txt
          git clone --recurse-submodules --shallow-submodules --depth 1 https://github.com/hedge-dev/XenonRecomp.git > /dev/null 2>&1
          python tools/patch_xenonrecomp.py XenonRecomp | tee logs/teste_08/06_patch.txt
          cmake -S XenonRecomp -B xr_build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ > logs/teste_08/03_cmake.txt 2>&1 || { tail -n 60 logs/teste_08/03_cmake.txt; exit 1; }
          cmake --build xr_build -j4 > logs/teste_08/04_build.txt 2>&1 || { tail -n 60 logs/teste_08/04_build.txt; exit 1; }
          XA=$(find xr_build -type f -name XenonAnalyse -perm -u+x | head -n1)
          "$XA" game_extracted/default.xex logs/teste_08/switch_tables.toml
          XR=$(find xr_build -type f -name XenonRecomp -perm -u+x | head -n1)
          CTX=$(find XenonRecomp -name ppc_context.h | head -n1)
          cat > xr.toml <<'EOF_TOML'
          [main]
          file_path = "game_extracted/default.xex"
          out_directory_path = "ppc_out"
          switch_table_file_path = "logs/teste_08/switch_tables.toml"
          savegprlr_14_address = 0x822AB790
          restgprlr_14_address = 0x822AB7E0
          savefpr_14_address = 0x822ABF00
          restfpr_14_address = 0x822ABF4C
          savevmx_14_address = 0x822ADA40
          restvmx_14_address = 0x822ADCD8
          EOF_TOML
          mkdir -p ppc_out
          timeout 1500 "$XR" xr.toml "$CTX" > logs/teste_08/05_recomp.txt 2>&1
          ls ppc_out | wc -l
          du -sh ppc_out
          echo "=== importacoes"
          grep -ohE '__imp__[A-Za-z0-9_]+' ppc_out/ppc_recomp_shared.h ppc_out/ppc_func_mapping.cpp | grep -v '__imp__sub_' | sort -u > logs/teste_08/imports.txt || true
          wc -l logs/teste_08/imports.txt
          head -n 120 logs/teste_08/imports.txt
          grep -ohE '\b(Nt|Vd|Xam|Ke|Rtl|Ex|Mm|Xe|Xma|Ob|Io|Hal|Kf|Xapi|Net|Xex)[A-Za-z0-9_]+' ppc_out/ppc_recomp_shared.h | sort -u > logs/teste_08/imports2.txt || true
          wc -l logs/teste_08/imports2.txt
          head -c 3000 ppc_out/ppc_recomp_shared.h > logs/teste_08/shared_head.txt
          tail -c 2500 ppc_out/ppc_recomp_shared.h > logs/teste_08/shared_tail.txt
          head -n 40 ppc_out/ppc_func_mapping.cpp > logs/teste_08/mapping_head.txt
          echo "=== funcoes auxiliares de v64+"
          grep -h -B3 -m2 "// stvx128 v64," ppc_out/ppc_recomp.*.cpp 2>/dev/null | head -n 24 > logs/teste_08/vmx64_save.txt || true
          grep -h -B3 -m2 "// lvx128 v64," ppc_out/ppc_recomp.*.cpp 2>/dev/null | head -n 24 > logs/teste_08/vmx64_rest.txt || true
          wc -l logs/teste_08/vmx64_save.txt logs/teste_08/vmx64_rest.txt
          EOF_CMD
          bash logs/teste_08/00_comando.txt 2>&1 | tee logs/teste_08/01_saida.txt

      - name: Guardar logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-teste-08
          path: logs/

      - name: Guardar C++ gerado (para o job iOS)
        uses: actions/upload-artifact@v4
        with:
          name: ppc-out
          retention-days: 1
          path: |
            ppc_out
            XenonRecomp/thirdparty/simde
            XenonRecomp/XenonUtils

  ios:
    needs: gerar
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ppc-out

      - name: Compilar para iPhone (arm64, iOS 15)
        shell: bash
        run: |
          mkdir -p logs/teste_08_ios obj
          cat > logs/teste_08_ios/00_comando.txt <<'EOF_CMD'
          set -e
          export SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK: $SDK"
          xcrun --sdk iphoneos clang++ --version | head -n 2
          echo "cpus: $(sysctl -n hw.ncpu)"
          cat > compile_one.sh <<'EOF_SH'
          #!/bin/bash
          f="$1"
          b=$(basename "$f" .cpp)
          s=$(date +%s)
          if xcrun --sdk iphoneos clang++ -target arm64-apple-ios15.0 -isysroot "$SDK" -std=c++20 -O1 -w -I ppc_out -I XenonRecomp/XenonUtils -I XenonRecomp/thirdparty/simde -c "$f" -o "obj/$b.o" > "logs/teste_08_ios/cc_$b.txt" 2>&1; then
            echo "OK $b $(( $(date +%s) - s ))s"
          else
            echo "FALHOU $b"
          fi
          EOF_SH
          chmod +x compile_one.sh
          START=$(date +%s)
          ls ppc_out/ppc_recomp.*.cpp ppc_out/ppc_func_mapping.cpp | xargs -P 4 -n 1 ./compile_one.sh | tee logs/teste_08_ios/resultados.txt
          echo "tempo total: $(( $(date +%s) - START ))s"
          ls obj/*.o | wc -l
          du -sh obj
          echo "falhas: $(grep -c FALHOU logs/teste_08_ios/resultados.txt || true)"
          for b in $(grep FALHOU logs/teste_08_ios/resultados.txt | head -n 3 | awk '{print $2}'); do
            echo "=== erro em $b"
            head -n 30 logs/teste_08_ios/cc_$b.txt
          done
          EOF_CMD
          bash logs/teste_08_ios/00_comando.txt 2>&1 | tee logs/teste_08_ios/01_saida.txt

      - name: Guardar logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-teste-08-ios
          path: logs/