name: Inspecionar pacote XBLA

on:
  workflow_dispatch:
    inputs:
      n:
        description: numero do teste
        default: '11'

jobs:
  rodar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Rodar
        shell: bash
        run: |
          mkdir -p logs/teste_${{ inputs.n }}
          bash tools/ci_run.sh ${{ inputs.n }} 2>&1 | tee logs/teste_${{ inputs.n }}/01_saida.txt

      - name: Guardar logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-teste-${{ inputs.n }}
          path: logs/