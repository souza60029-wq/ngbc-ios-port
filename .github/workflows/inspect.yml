name: Inspecionar pacote XBLA

on:
  workflow_dispatch:

jobs:
  rodar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Gerar, compilar o host e rodar o jogo
        shell: bash
        run: |
          mkdir -p logs/teste_10
          cat > logs/teste_10/00_comando.txt <<'EOF_CMD'
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang cmake ninja-build
          curl -sS -L --fail -o game.pkg "https://github.com/souza60029-wq/ngbc-ios-port/releases/download/v1.0/B26872135B74C4F9A63367A857857D22456064C258"
          python tools/stfs_extract.py game.pkg game_extracted > logs/teste_10/02_stfs.txt
          git clone --recurse-submodules --shallow-submodules --depth 1 https://github.com/hedge-dev/XenonRecomp.git > /dev/null 2>&1
          python tools/patch_xenonrecomp.py XenonRecomp | tee logs/teste_10/06_patch.txt
          python tools/patch_extras.py XenonRecomp | tee logs/teste_10/06b_patch_extras.txt
          cmake -S XenonRecomp -B xr_build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ > logs/teste_10/03_cmake.txt 2>&1 || { tail -n 60 logs/teste_10/03_cmake.txt; exit 1; }
          cmake --build xr_build -j4 > logs/teste_10/04_build.txt 2>&1 || { tail -n 60 logs/teste_10/04_build.txt; exit 1; }
          XA=$(find xr_build -type f -name XenonAnalyse -perm -u+x | head -n1)
          "$XA" game_extracted/default.xex logs/teste_10/switch_tables.toml
          mkdir -p dump
          DUMP=$(find xr_build -type f -name XenonDump -perm -u+x | head -n1)
          "$DUMP" game_extracted/default.xex dump/img
          XR=$(find xr_build -type f -name XenonRecomp -perm -u+x | head -n1)
          CTX=$(find XenonRecomp -name ppc_context.h | head -n1)
          cat > xr.toml <<'EOF_TOML'
          [main]
          file_path = "game_extracted/default.xex"
          out_directory_path = "ppc_out"
          switch_table_file_path = "logs/teste_10/switch_tables.toml"
          savegprlr_14_address = 0x822AB790
          restgprlr_14_address = 0x822AB7E0
          savefpr_14_address = 0x822ABF00
          restfpr_14_address = 0x822ABF4C
          savevmx_14_address = 0x822ADA40
          restvmx_14_address = 0x822ADCD8
          savevmx_64_address = 0x822ADAD4
          restvmx_64_address = 0x822ADD6C
          EOF_TOML
          mkdir -p ppc_out
          timeout 1500 "$XR" xr.toml "$CTX" > logs/teste_10/05_recomp.txt 2>&1
          tr '\r' '\n' < logs/teste_10/05_recomp.txt | grep -v '^[[:space:]]*$' | tail -n 6
          grep -ohE '__imp__[A-Za-z0-9_]+' ppc_out/ppc_recomp_shared.h ppc_out/ppc_func_mapping.cpp | grep -v '__imp__sub_' | sort -u > logs/teste_10/imports.txt
          python tools/gen_stubs.py logs/teste_10/imports.txt ppc_out/stubs_gen.cpp
          echo "entrada declarada: $(grep -c 'sub_822C64A0' ppc_out/ppc_recomp_shared.h)"
          echo "=== compilando o host (Linux)"
          mkdir -p obj
          cat > compile_one.sh <<'EOF_SH'
          #!/bin/bash
          f="$1"
          b=$(basename "$f" .cpp)
          if clang++ -std=c++20 -O1 -w -march=native -I ppc_out -I XenonRecomp/XenonUtils -I XenonRecomp/thirdparty/simde -c "$f" -o "obj/$b.o" > "logs/teste_10/cc_$b.txt" 2>&1; then
            echo "OK $b"
          else
            echo "FALHOU $b"
          fi
          EOF_SH
          chmod +x compile_one.sh
          ls ppc_out/ppc_recomp.*.cpp ppc_out/ppc_func_mapping.cpp ppc_out/stubs_gen.cpp runtime/runtime.cpp | xargs -P 4 -n 1 ./compile_one.sh > logs/teste_10/compilacao.txt
          echo "compilados: $(grep -c '^OK' logs/teste_10/compilacao.txt)  falhas: $(grep -c FALHOU logs/teste_10/compilacao.txt || true)"
          for b in $(grep FALHOU logs/teste_10/compilacao.txt | head -n 3 | awk '{print $2}'); do
            echo "=== erro em $b"
            head -n 30 logs/teste_10/cc_$b.txt
          done
          clang++ obj/*.o -o ngbc_host -rdynamic -lpthread 2> logs/teste_10/link.txt || { echo "=== erro de link"; head -n 40 logs/teste_10/link.txt; exit 1; }
          ls -l ngbc_host
          echo "=== rodando o jogo (25 s)"
          set +e
          timeout 90 ./ngbc_host dump/img_image.bin 25 > logs/teste_10/run_stdout.txt 2> logs/teste_10/run.txt
          echo "saida do jogo: $?"
          set -e
          head -n 150 logs/teste_10/run.txt
          EOF_CMD
          bash logs/teste_10/00_comando.txt 2>&1 | tee logs/teste_10/01_saida.txt

      - name: Guardar logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-teste-10
          path: logs/