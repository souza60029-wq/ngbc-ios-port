name: Inspecionar pacote XBLA

on:
  workflow_dispatch:

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Gerar C++, despejar imagem e anotar importacoes
        shell: bash
        run: |
          mkdir -p logs/teste_09
          cat > logs/teste_09/00_comando.txt <<'EOF_CMD'
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang cmake ninja-build
          curl -sS -L --fail -o game.pkg "https://github.com/souza60029-wq/ngbc-ios-port/releases/download/v1.0/B26872135B74C4F9A63367A857857D22456064C258"
          python tools/stfs_extract.py game.pkg game_extracted > logs/teste_09/02_stfs.txt
          git clone --recurse-submodules --shallow-submodules --depth 1 https://github.com/hedge-dev/XenonRecomp.git > /dev/null 2>&1
          python tools/patch_xenonrecomp.py XenonRecomp | tee logs/teste_09/06_patch.txt
          python tools/patch_extras.py XenonRecomp | tee logs/teste_09/06b_patch_extras.txt
          cmake -S XenonRecomp -B xr_build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ > logs/teste_09/03_cmake.txt 2>&1 || { tail -n 60 logs/teste_09/03_cmake.txt; exit 1; }
          cmake --build xr_build -j4 > logs/teste_09/04_build.txt 2>&1 || { tail -n 60 logs/teste_09/04_build.txt; exit 1; }
          XA=$(find xr_build -type f -name XenonAnalyse -perm -u+x | head -n1)
          "$XA" game_extracted/default.xex logs/teste_09/switch_tables.toml
          XR=$(find xr_build -type f -name XenonRecomp -perm -u+x | head -n1)
          CTX=$(find XenonRecomp -name ppc_context.h | head -n1)
          echo "=== XenonDump"
          mkdir -p dump
          DUMP=$(find xr_build -type f -name XenonDump -perm -u+x | head -n1)
          "$DUMP" game_extracted/default.xex dump/img
          cp dump/img_manifest.txt logs/teste_09/manifest.txt
          ls -l dump
          head -n 20 logs/teste_09/manifest.txt
          grep -c '^symbol' logs/teste_09/manifest.txt || true
          cat > xr.toml <<'EOF_TOML'
          [main]
          file_path = "game_extracted/default.xex"
          out_directory_path = "ppc_out"
          switch_table_file_path = "logs/teste_09/switch_tables.toml"
          savegprlr_14_address = 0x822AB790
          restgprlr_14_address = 0x822AB7E0
          savefpr_14_address = 0x822ABF00
          restfpr_14_address = 0x822ABF4C
          savevmx_14_address = 0x822ADA40
          restvmx_14_address = 0x822ADCD8
          EOF_TOML
          mkdir -p ppc_out
          timeout 1500 "$XR" xr.toml "$CTX" > logs/teste_09/05_recomp.txt 2>&1
          ls ppc_out | wc -l
          du -sh ppc_out
          echo "=== como as importacoes aparecem no codigo gerado"
          grep -h -m3 -B1 -A3 "__imp__NtClose" ppc_out/ppc_recomp_shared.h ppc_out/ppc_func_mapping.cpp > logs/teste_09/imp_decl.txt || true
          grep -h -m6 "__imp__NtCreateFile\|__imp__NtClose" ppc_out/ppc_recomp.*.cpp 2>/dev/null | head -n 8 > logs/teste_09/imp_call.txt || true
          head -n 20 logs/teste_09/imp_decl.txt
          head -n 8 logs/teste_09/imp_call.txt
          echo "=== cabecalho das funcoes de v64+"
          grep -h -B2 -A3 -m4 "// li r11,-1024" ppc_out/ppc_recomp.*.cpp 2>/dev/null | head -n 40 > logs/teste_09/vmx64_hdr.txt || true
          cat logs/teste_09/vmx64_hdr.txt
          EOF_CMD
          bash logs/teste_09/00_comando.txt 2>&1 | tee logs/teste_09/01_saida.txt

      - name: Guardar logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-teste-09
          path: logs/

      - name: Guardar C++ gerado (para o job iOS)
        uses: actions/upload-artifact@v4
        with:
          name: ppc-out
          retention-days: 1
          path: |
            ppc_out
            XenonRecomp/thirdparty/simde
            XenonRecomp/XenonUtils

  ios:
    needs: gerar
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ppc-out

      - name: Compilar para iPhone (arm64, iOS 15)
        shell: bash
        run: |
          mkdir -p logs/teste_09_ios obj
          cat > logs/teste_09_ios/00_comando.txt <<'EOF_CMD'
          set -e
          export SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "cpus: $(sysctl -n hw.ncpu)"
          cat > compile_one.sh <<'EOF_SH'
          #!/bin/bash
          f="$1"
          b=$(basename "$f" .cpp)
          s=$(date +%s)
          if xcrun --sdk iphoneos clang++ -target arm64-apple-ios15.0 -isysroot "$SDK" -std=c++20 -O1 -w -I ppc_out -I XenonRecomp/XenonUtils -I XenonRecomp/thirdparty/simde -c "$f" -o "obj/$b.o" > "logs/teste_09_ios/cc_$b.txt" 2>&1; then
            echo "OK $b $(( $(date +%s) - s ))s"
          else
            echo "FALHOU $b"
          fi
          EOF_SH
          chmod +x compile_one.sh
          START=$(date +%s)
          ls ppc_out/ppc_recomp.*.cpp ppc_out/ppc_func_mapping.cpp | xargs -P 4 -n 1 ./compile_one.sh | tee logs/teste_09_ios/resultados.txt
          echo "tempo total: $(( $(date +%s) - START ))s"
          ls obj/*.o | wc -l
          du -sh obj
          echo "falhas: $(grep -c FALHOU logs/teste_09_ios/resultados.txt || true)"
          for b in $(grep FALHOU logs/teste_09_ios/resultados.txt | head -n 3 | awk '{print $2}'); do
            echo "=== erro em $b"
            head -n 30 logs/teste_09_ios/cc_$b.txt
          done
          EOF_CMD
          bash logs/teste_09_ios/00_comando.txt 2>&1 | tee logs/teste_09_ios/01_saida.txt

      - name: Guardar logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-teste-09-ios
          path: logs/