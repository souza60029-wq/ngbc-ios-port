name: Inspecionar pacote XBLA

on:
  workflow_dispatch:

jobs:
  inspecionar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Baixar e extrair o pacote STFS
        shell: bash
        run: |
          mkdir -p logs/teste_02
          cat > logs/teste_02/00_comando.txt <<'EOF_CMD'
          set -e
          curl -L --fail -o game.pkg "https://github.com/souza60029-wq/ngbc-ios-port/releases/download/v1.0/B26872135B74C4F9A63367A857857D22456064C258"
          ls -l game.pkg
          python tools/stfs_extract.py game.pkg game_extracted
          EOF_CMD
          bash logs/teste_02/00_comando.txt 2>&1 | tee logs/teste_02/01_saida.txt

      - name: Guardar logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-teste-02
          path: logs/